<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NestJS Socket.IO Test</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        padding: 30px;
      }
      h2 {
        color: #444;
      }
      #log {
        background: white;
        border-radius: 8px;
        padding: 15px;
        height: 300px;
        overflow-y: auto;
        border: 1px solid #ddd;
      }
      input,
      button {
        padding: 8px 12px;
        margin: 5px;
        border-radius: 6px;
        border: 1px solid #ccc;
      }
      button {
        background: #2b7dfa;
        color: white;
        border: none;
        cursor: pointer;
      }
      button:hover {
        background: #1a5ed9;
      }
    </style>
  </head>
  <body>
    <h2>🔌 NestJS Socket.IO Realtime Test</h2>

    <div>
      <input id="jwt" type="text" placeholder="Enter JWT Token" size="50" />
      <button onclick="connectSocket()">Connect</button>
    </div>

    <div style="margin-top: 15px">
      <input id="message" type="text" placeholder="Type your message" />
      <button onclick="sendMessage()">Send</button>
    </div>

    <h3>Logs:</h3>
    <div id="log"></div>

    <script>
      let socket;

      const log = (msg) => {
        const logDiv = document.getElementById('log');
        logDiv.innerHTML += `<div>${msg}</div>`;
        logDiv.scrollTop = logDiv.scrollHeight;
      };

      function connectSocket() {
        const token = document.getElementById('jwt').value.trim();
        if (!token) {
          alert('Please enter your JWT token first!');
          return;
        }

        socket = io('http://localhost:3000', {
          transports: ['websocket'],
          auth: { token },
        });

        socket.on('connect', () => {
          log(`✅ Connected with id: ${socket.id}`);
        });

        socket.on('disconnect', () => {
          log('❌ Disconnected from server');
        });

        socket.on('receive_message', (data) => {
          log(`📩 ${data.sender}: ${data.message}`);
        });

        socket.on('connect_error', (err) => {
          log(`⚠️ Connection error: ${err.message}`);
        });
      }

      function sendMessage() {
        if (!socket || !socket.connected) {
          alert('Socket not connected!');
          return;
        }

        const message = document.getElementById('message').value.trim();
        if (message) {
          socket.emit('send_message', { message });
          log(`🧠 You: ${message}`);
          document.getElementById('message').value = '';
        }
      }
    </script>
  </body>
</html>
